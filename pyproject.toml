[project]
name = "garbage-segregation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RajorshiDey", email = "rajorshideys@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typing>=3.10.0.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
garbage-segregation = "garbage_segregation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
